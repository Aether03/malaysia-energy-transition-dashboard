name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, as the README asks of a clone (some tests read git)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: sqlfluff (non-blocking until the SQL is cleaned up)
        continue-on-error: true
        run: python -m sqlfluff lint sql/
      - name: pytest (no SQL Server or Power BI needed)
        run: python -m pytest -q
